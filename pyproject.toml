[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-explorer-mcp"
version = "0.1.0"
description = "MCP server for exploring phage-match ML experiments on S3"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "boto3>=1.41,<2",
    "botocore[crt]>=1.41,<2",
    "fastmcp>=2.12,<5",
    "pandas>=2.2.2,<4",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.4.2,<2",
]

# Minimums are checked by the minimum-versions CI job; upper bounds stop at the next
# untested major version.
[project.optional-dependencies]
plot = [
    "matplotlib>=3.8.4,<4",
]
dev = [
    "moto[s3]>=5,<6",
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]

[project.scripts]
experiment-explorer-mcp = "experiment_explorer.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
