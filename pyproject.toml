[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-explorer-mcp"
version = "0.1.0"
description = "MCP server for exploring phage-match ML experiments on S3"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "boto3>=1.34",
    "botocore[crt]>=1.34",
    "fastmcp>=2.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
experiment-explorer-mcp = "experiment_explorer.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
