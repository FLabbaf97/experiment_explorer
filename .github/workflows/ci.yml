name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,plot]"
      - name: Lint
        run: ruff check .
      - name: Test (includes starting the server over stdio)
        run: pytest

  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the lowest declared versions
        run: |
          python -m pip install uv
          uv pip install --system --resolution lowest-direct -e ".[dev,plot]"
      - name: Test
        run: pytest
